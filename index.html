const u8=b=>Uint8Array.from(atob(b),x=>x.charCodeAt(0));
// Ancienne version : mot de passe en clair dans localStorage -> on le supprime systématiquement.
try{localStorage.removeItem('cdf_pw');}catch(_){}
// "Rester connecté" : on ne garde QUE une clé AES non extractable (CryptoKey) dans IndexedDB, jamais le mot de passe.
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('cdf',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const idbDo=async(mode,fn)=>{const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('k',mode),q=fn(tx.objectStore('k'));tx.oncomplete=()=>{db.close();res(q&&q.result);};tx.onerror=()=>rej(tx.error);});};
const keyGet=()=>idbDo('readonly',s=>s.get('k'));
const keySet=k=>idbDo('readwrite',s=>s.put(k,'k'));
const keyDel=()=>idbDo('readwrite',s=>s.delete('k'));
async function derive(pwd){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function decryptWith(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
document.getElementById('eye').onclick=function(){const i=document.getElementById('pw'),h=i.type==='password';i.type=h?'text':'password';this.textContent=h?'🙈':'👁';this.setAttribute('aria-label',h?'Masquer le mot de passe':'Afficher le mot de passe');i.focus();};
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('go'),err=document.getElementById('err');
  const pwd=document.getElementById('pw').value,rem=document.getElementById('rem').checked;
  b.disabled=true;err.textContent='';
  let key,html;
  try{key=await derive(pwd);html=await decryptWith(key);}
  catch(_){err.textContent='Mot de passe incorrect.';b.disabled=false;return;}
  if(rem){try{await keySet(key);}catch(_){}}else{try{await keyDel();}catch(_){}}
  show(html);
});
(async()=>{
  try{
    const key=await keyGet();
    if(!key)return;
    try{show(await decryptWith(key));}
    catch(_){try{await keyDel();}catch(__){}}   // clé obsolète (mot de passe changé) -> on redemande
  }catch(_){}
})();
</script></body></html>
