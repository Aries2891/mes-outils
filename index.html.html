const u8=b=>Uint8Array.from(atob(b),x=>x.charCodeAt(0));
async function open(pwd){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
const K='cdf_pw';
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('go'),err=document.getElementById('err'),pwd=document.getElementById('pw').value;
  b.disabled=true;err.textContent='';
  try{
    await open(pwd);
    try{ if(document.getElementById('rem')&&0){} }catch(_){}
  }catch(_){err.textContent='Mot de passe incorrect.';b.disabled=false;return;}
});
// mémorisation : on lit la case AVANT d'écraser le document
document.getElementById('f').addEventListener('submit',()=>{
  try{ if(document.getElementById('rem').checked) localStorage.setItem(K,document.getElementById('pw').value); }catch(_){}
},true);
(async()=>{ try{ const p=localStorage.getItem(K); if(p){ await open(p); } }catch(_){ try{localStorage.removeItem(K)}catch(__){} } })();
</script></body></html>
