<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Plan d'action tract 6U — par magasin</title>
<style>
  :root{
    --ink:#12263a; --paper:#fbfaf7; --line:#dcd7cf;
    --rupture:#b21f2d; --rupture-bg:#fdecee;
    --faible:#e8871e; --faible-bg:#fdf0dd;
    --impl:#c8641a; --impl-bg:#fdefe2;
    --recul:#c0392b; --recul-bg:#fdeae7;
    --suivi:#7a6410; --suivi-bg:#fbf3d6;
    --head:#12263a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4}
  header{padding:30px 26px 24px;border-bottom:2px solid var(--ink);text-align:center}
  h1{margin:0;font-size:34px;letter-spacing:-.01em}
  .progline{margin-top:14px;font-size:24px;font-weight:700}
  .progline .mag{color:var(--ink)}
  .progline .up{color:#1e7a34}
  .progline .down{color:var(--rupture)}
  .progline .nat{color:#5b6b7a;font-size:18px;font-weight:600}
  .controls{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;padding:16px 26px;background:#f2efe8;border-bottom:1px solid var(--line)}
  .ctl label{display:block;font-size:11px;color:#5b6b7a;margin-bottom:4px}
  .mag-tabs{display:flex;gap:0;border:1px solid var(--ink);border-radius:7px;overflow:hidden}
  .mag-tabs button{border:0;background:#fff;padding:9px 18px;font-size:14px;cursor:pointer;font-weight:600;color:var(--ink);border-right:1px solid var(--line)}
  .mag-tabs button:last-child{border-right:0}
  .mag-tabs button.active{background:var(--ink);color:#fff}
  .mag-tabs button.grp{font-weight:800;color:#b21f2d}
  .mag-tabs button.grp.active{background:#b21f2d;color:#fff}
  .mag-tabs button.mag-hes{font-weight:800;color:#1e7a34}
  .mag-tabs button.mag-hes.active{background:#1e7a34;color:#fff}
  .mag-tabs button.mag-wal{font-weight:800;color:#1d5fa8}
  .mag-tabs button.mag-wal.active{background:#1d5fa8;color:#fff}
  .mag-tabs button.mag-sie{font-weight:800;color:#a8860a}
  .mag-tabs button.mag-sie.active{background:#e0a900;color:#fff}
  .counts{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
  .pill{padding:4px 10px;border-radius:20px;font-weight:600;cursor:pointer;user-select:none;border:2px solid transparent;transition:transform .05s}
  .pill:hover{transform:translateY(-1px)}
  .pill.on{border-color:currentColor;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .pill.all{background:#e7e2d9;color:#4a4034}
  .pill.r{background:var(--rupture-bg);color:var(--rupture)}
  .pill.f{background:var(--faible-bg);color:var(--faible)}
  .pill.i{background:var(--impl-bg);color:var(--impl)}
  .pill.e{background:var(--recul-bg);color:var(--recul)}
  .pill.s{background:var(--suivi-bg);color:var(--suivi)}
  .pill.c{background:#d7f0dd;color:#1e7a34}
  .pill.n{background:#f7ecc9;color:#8a6d00}
  .wrap{padding:8px 20px 60px}
  table{border-collapse:collapse;width:100%;background:#fff;font-variant-numeric:tabular-nums}
  th,td{padding:7px 10px;border:1px solid var(--line);text-align:center}
  th{background:var(--head);color:#fff;position:sticky;top:0;cursor:pointer;user-select:none;font-size:12px;white-space:nowrap}
  th:hover{background:#1d3a56}
  th .arr{opacity:.5;font-size:10px;margin-left:3px}
  td.prod{text-align:left;max-width:280px}
  td.badge{font-weight:700;color:#fff;font-size:10.5px;letter-spacing:.04em;line-height:1.25;text-transform:uppercase}
  td.badge .camag{font-size:11px;font-weight:600;opacity:.92;text-transform:none;letter-spacing:0}
  .b-r{background:var(--rupture)} .b-i{background:var(--impl)} .b-f{background:var(--faible)}
  .b-e{background:var(--recul);color:#fff} .b-s{background:var(--suivi);color:#fff}
  .b-c{background:#1e7a34;color:#fff}
  .b-n{background:#b08900;color:#fff}
  td.stock.r{background:var(--rupture);color:#fff;font-weight:700}
  td.stock.f{background:var(--faible);color:#fff;font-weight:700}
  td.stock.i{background:var(--impl);color:#fff;font-weight:700}
  tr:nth-child(even) td:not(.badge):not(.stock){background:#faf9f6}
  td.code{cursor:pointer;font-weight:600;color:#12263a;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
  td.code:hover{background:#e8eef4}
  td.code.copied{background:#c6efce;color:#006100;text-decoration:none}
  .neg{color:var(--rupture);font-weight:600}
  td.pnat{color:#7a8794;font-style:italic}
  td.camagcol{font-weight:700;color:#12263a}
  td.pnat.neg{color:#c98a86;font-weight:600;font-style:italic}
  footer{padding:14px 26px;color:#8a97a3;font-size:11.5px;border-top:1px solid var(--line)}
  /* ===== MOBILE : meme tableau qu'en PC, fenetre figee deroulante ===== */
  .wrap{-webkit-overflow-scrolling:touch}
  @media (max-width:720px){
    header{padding:18px 14px 14px}
    h1{font-size:22px}
    .progline{font-size:16px;line-height:1.4}
    .progline .nat{display:block;font-size:13px;margin-top:2px}
    .controls{padding-left:10px;padding-right:10px}
    .mag-tabs{flex-wrap:wrap}
    .mag-tabs button{flex:1 1 40%;padding:10px 8px}
    .counts{gap:8px}
    .pill{font-size:12px}
    /* fenetre de defilement : hauteur figee, entete + 1ere colonne fixes */
    .wrap{padding:0 10px 24px;max-height:74vh;overflow:auto;border:1px solid var(--line);
      border-radius:8px;margin-top:8px}
    #tbl{width:max-content;min-width:100%;font-size:13px}
    #tbl th,#tbl td{white-space:nowrap;padding:9px 10px}
    #tbl td.prod{white-space:normal;max-width:170px}
    #tbl th{top:0;z-index:3;font-size:11.5px}
    /* 1ere colonne (Priorite) figee a gauche pendant le defilement horizontal */
    #tbl th:first-child,#tbl td.badge{position:sticky;left:0;z-index:2}
    #tbl th:first-child{z-index:4;min-width:42px;max-width:42px;padding:9px 3px;font-size:0}
    #tbl th:first-child::after{content:"Prio.";font-size:10px}
    #tbl td.badge{min-width:42px;max-width:42px;width:42px;white-space:normal;
      font-size:0;line-height:1.1;padding:6px 2px;word-break:break-word}
    #tbl td.badge::after{content:attr(data-short);font-size:8.5px;font-weight:800}
    footer{padding:12px 14px;font-size:11px}
  }
  @media (max-width:640px){
    #tbl{font-size:12.5px}
    #tbl td.prod{max-width:140px}
  }
</style>
</head>

<div id="passGate" style="position:fixed;inset:0;z-index:9999;background:#12263a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <div style="font-size:20px;font-weight:700;">Plan d'action tract</div>

  <input id="passInput" type="password" placeholder="Mot de passe" autocomplete="off" style="padding:10px 14px;border-radius:6px;border:1px solid #46607a;font-size:15px;width:220px;text-align:center;">
  <button id="passBtn" style="padding:10px 22px;border-radius:6px;border:0;background:#e0a900;color:#12263a;font-weight:700;cursor:pointer;">Valider</button>
  <div id="passErr" style="color:#ff8080;font-size:12px;height:14px;"></div>
</div>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function dechiffrer(motDePasse) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(motDePasse), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(ENC_BLOB.salt), iterations: ENC_BLOB.iterations, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plainBuf = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(ENC_BLOB.iv) },
    key,
    b64ToBytes(ENC_BLOB.data)
  );
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

(function(){
  var gate = document.getElementById('passGate');
  var input = document.getElementById('passInput');
  var btn = document.getElementById('passBtn');
  var err = document.getElementById('passErr');

  function demarrerAvecDonnees(d){
    gate.style.display = 'none';
    window.demarrerApp(d);
  }

  // Cache local : si les donnees dechiffrees correspondent au fichier actuel
  // (meme cle de chiffrement) ET que le cache n'est pas trop vieux, pas besoin
  // de retaper le mot de passe. Au-dela de la duree de validite, le mot de
  // passe est redemande meme si les donnees n'ont pas change.
  // On attend que la page soit entierement chargee (window.demarrerApp doit
  // deja exister) avant de tenter le demarrage automatique depuis le cache.
  var DUREE_CACHE_MS = 2 * 60 * 60 * 1000; // 2 heures

  function essayerCache(){
    try {
      if (localStorage.getItem('tractCacheKey') === ENC_BLOB.data) {
        var horodatage = parseInt(localStorage.getItem('tractCacheDate') || '0', 10);
        if (!horodatage || (Date.now() - horodatage) > DUREE_CACHE_MS) {
          localStorage.removeItem('tractCacheKey');
          localStorage.removeItem('tractCacheJSON');
          localStorage.removeItem('tractCacheDate');
          return false;
        }
        var cache = localStorage.getItem('tractCacheJSON');
        if (cache) {
          demarrerAvecDonnees(JSON.parse(cache));
          return true;
        }
      }
    } catch(e) {}
    return false;
  }

  function initGate(){
    if (!essayerCache()) {
      input.focus();
    }
  }

  if (document.readyState === 'complete') {
    setTimeout(initGate, 50);
  } else {
    window.addEventListener('load', function(){ setTimeout(initGate, 50); });
  }

  function tenter(){
    btn.disabled = true;
    err.textContent = '';
    dechiffrer(input.value).then(function(d){
      try {
        localStorage.setItem('tractCacheKey', ENC_BLOB.data);
        localStorage.setItem('tractCacheJSON', JSON.stringify(d));
        localStorage.setItem('tractCacheDate', String(Date.now()));
      } catch(e) {}
      demarrerAvecDonnees(d);
    }).catch(function(){
      err.textContent = 'Mot de passe incorrect';
      input.value = '';
      input.focus();
      btn.disabled = false;
    });
  }
  btn.addEventListener('click', tenter);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tenter(); });
})();

<script>
function demarrerApp(D){
const DATA=D.DATA, SEUIL=D.SEUIL, NAT_PROG=D.NAT_PROG, MAG_PROG=D.MAG_PROG, MAG_CA=D.MAG_CA, NAT_CA=D.NAT_CA;

// colonnes : clé, libellé, type
const SHORT_BADGE = {"b-r":"RUPT.","b-f":"FAIBLE","b-i":"AVANT","b-e":"PERF.","b-s":"SUIVI","b-n":"NOUV.","b-c":"CONF."};
const COLS = [
  {k:"priorite", t:"Priorité"},
  {k:"rang", t:"Rang nat."},
  {k:"code", t:"Code"},
  {k:"nom", t:"Produit"},
  {k:"gamme", t:"Gamme"},
  {k:"ca_nat", t:"CA nat. (€)"},
  {k:"ca_mag", t:"CA mag. (€)"},
  {k:"stock", t:"Stock"},
  {k:"situation", t:"Situation"},
  {k:"prog_mag", t:"Prog mag."},
  {k:"prog_nat", t:"Prog nat."},
];

// niveau de gravité : 4 rupture, 3.7 stock faible, 3.5 mise en avant,
// 2.5/2 mauvaise perf, 1 sous national, 0.7 nouveauté, 0.5 conforme
function evaluate(d){
  const stock = d.stock;              // peut être 0 (rupture), un nombre, ou null (inconnu)
  let sev, badge, bcls, situation;
  const prog = d.prog_mag;         // progression magasin sur la réf
  const progNat = d.prog_nat;      // progression NATIONALE de la même réf
  const ca = d.ca_mag;
  const novente = (ca===0) || (ca===null && prog===null);
  // seuil de tendance = progression nationale DU produit (pas un seuil global)
  const seuilRef = (progNat===null) ? SEUIL : progNat;
  // stock connu = number ; inconnu = null. Rupture/stock faible seulement si stock connu.
  const stockConnu = (typeof stock === "number");
  if(stockConnu && stock===0){ sev=4; badge="Rupture"; bcls="b-r"; situation="Stock 0 — rupture"; }
  else if(stockConnu && stock<3){ sev=3.7; badge="Stock faible"; bcls="b-f"; situation="Stock < 3 — à réappro"; }
  else if(novente){ sev=3.5; badge="Mise en avant à contrôler"; bcls="b-i"; situation="Aucune vente / stock dispo"; }
  else if(prog!==null && prog<0){ sev = prog<=-50?2.5:2; badge="Mauvaise performance"; bcls="b-e"; situation="En recul vs N-1"; }
  else if(prog!==null && prog>=seuilRef){ sev=0.5; badge="Prog conforme"; bcls="b-c"; situation="≥ national du produit"; }
  else if(prog!==null){ sev=1; badge="À suivre"; bcls="b-s"; situation="Sous le national du produit"; }
  else if(ca!==null && ca>0 && prog===null){ sev=0.7; badge="Nouveauté"; bcls="b-n"; situation="Nouveauté magasin"; }
  else { sev=0; badge=""; bcls=""; situation=""; }
  return {sev,badge,bcls,situation};
}

let curMag = Object.keys(DATA)[0];
let curFilter = "all";
let sortKey = "priorite", sortDir = -1; // -1 desc

const TOP_N_NATIONAL = 50; // on n'analyse que le Top 50 CA national (rang <= 50)

function rowsFor(mag){
  return DATA[mag].filter(d=>d.rang<=TOP_N_NATIONAL).map(d=>{
    const e = evaluate(d);
    return {...d, sev:e.sev, badge:e.badge, bcls:e.bcls, situation:e.situation};
  }).filter(r=>r.badge!==""); // toutes les réfs classées (pas de limite à 50)
}

// une référence est "en alerte" si rupture / stock faible / mise en avant / mauvaise perf
function estAlerte(sev){ return sev===4 || sev===3.7 || sev===3.5 || (sev>=2 && sev<3); }

// flops groupe : références en alerte dans les 3 magasins simultanément
function flopsGroupe(){
  const mags = Object.keys(DATA);
  // indexer chaque magasin par code -> ligne évaluée
  const idx = {};
  mags.forEach(m=>{
    idx[m] = {};
    rowsFor(m).forEach(r=>{ idx[m][r.code] = r; });
  });
  // codes présents et en alerte dans TOUS les magasins
  const base = mags[0];
  const out = [];
  Object.keys(idx[base]).forEach(code=>{
    const parMag = mags.map(m=> idx[m][code]);
    if(parMag.every(r=> r && estAlerte(r.sev))){
      // gravité groupe = somme des sev (plus c'est haut, plus c'est grave partout)
      const scoreGrp = parMag.reduce((s,r)=>s+r.sev,0);
      out.push({code, nom: idx[base][code].nom, rang: idx[base][code].rang,
                ca_nat: idx[base][code].ca_nat, prog_nat: idx[base][code].prog_nat,
                parMag, scoreGrp});
    }
  });
  out.sort((a,b)=> b.scoreGrp - a.scoreGrp || b.ca_nat - a.ca_nat);
  return out;
}

function fmtEuro(v){ return v==null?"":Math.round(v).toLocaleString("fr-FR")+" €"; }
function fmtProg(v){ return v==null?"—":(v>0?"+":"")+v.toFixed(1)+"%"; }
function fmtStock(v){ return v==null?"0":Math.round(v); }

function render(){
  const isGroupe = (curMag === "GROUPE");
  // bandeau progression magasin vs national
  if(isGroupe){
    const totGrp = Object.values(MAG_CA).reduce((s,v)=>s+v,0);
    document.getElementById("progline").innerHTML =
      `<span class="mag">Consolidation GROUPE — flops présents dans les 3 magasins</span>`+
      ` <span class="nat">CA total 3 magasins : ${fmtEuro(totGrp)}</span>`;
  } else {
    const mp = MAG_PROG[curMag];
    const cls = mp>=NAT_PROG ? "up" : "down";
    const signe = mp>=0?"+":"";
    document.getElementById("progline").innerHTML =
      `<span class="mag">${curMag} : ${fmtEuro(MAG_CA[curMag])} · <span class="${cls}">${signe}${mp.toFixed(1)} %</span></span>`+
      ` <span class="nat">vs National ${fmtEuro(NAT_CA)} · +${NAT_PROG.toFixed(1)} %</span>`;
  }
  // tabs (magasins + GROUPE)
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  [...Object.keys(DATA), "GROUPE"].forEach(m=>{
    const b=document.createElement("button");
    b.textContent=m; if(m===curMag)b.className=(b.className?b.className+" ":"")+"active";
    if(m==="GROUPE") b.classList.add("grp");
    if(m==="Hesingue") b.classList.add("mag-hes");
    if(m==="Waldighoffen") b.classList.add("mag-wal");
    if(m==="Sierentz") b.classList.add("mag-sie");
    b.onclick=()=>{curMag=m;curFilter="all";render();};
    tabs.appendChild(b);
  });

  if(isGroupe){ renderGroupe(); return; }

  // head
  const head=document.getElementById("head"); head.innerHTML="";
  COLS.forEach(c=>{
    const th=document.createElement("th");
    th.innerHTML=c.t+(sortKey===c.k?' <span class="arr">'+(sortDir<0?"▼":"▲")+'</span>':' <span class="arr">↕</span>');
    th.onclick=()=>{ if(sortKey===c.k)sortDir=-sortDir; else {sortKey=c.k;sortDir=(c.k==="nom"||c.k==="code")?1:-1;} render(); };
    head.appendChild(th);
  });
  // rows
  let allRows = rowsFor(curMag);
  // counts (toujours calculés sur l'ensemble, pas sur le filtre)
  const cr=allRows.filter(r=>r.sev===4).length, cf=allRows.filter(r=>r.sev===3.7).length,
        ci=allRows.filter(r=>r.sev===3.5).length,
        ce=allRows.filter(r=>r.sev>=2&&r.sev<3).length, cs=allRows.filter(r=>r.sev===1).length,
        cn=allRows.filter(r=>r.sev===0.7).length,
        cc=allRows.filter(r=>r.sev===0.5).length;
  // définition des filtres : clé, libellé, classe, test
  const FILTERS = [
    {k:"all", lbl:`Tout (${allRows.length})`, cls:"all", test:()=>true},
    {k:"r", lbl:`${cr} rupture`, cls:"r", test:r=>r.sev===4},
    {k:"f", lbl:`${cf} stock faible`, cls:"f", test:r=>r.sev===3.7},
    {k:"i", lbl:`${ci} mise en avant`, cls:"i", test:r=>r.sev===3.5},
    {k:"e", lbl:`${ce} mauvaise perf.`, cls:"e", test:r=>r.sev>=2&&r.sev<3},
    {k:"s", lbl:`${cs} sous national`, cls:"s", test:r=>r.sev===1},
    {k:"n", lbl:`${cn} nouveauté`, cls:"n", test:r=>r.sev===0.7},
    {k:"c", lbl:`${cc} conforme`, cls:"c", test:r=>r.sev===0.5},
  ];
  const cont = document.getElementById("counts"); cont.innerHTML="";
  FILTERS.forEach(f=>{
    const sp=document.createElement("span");
    sp.className="pill "+f.cls+(curFilter===f.k?" on":"");
    sp.textContent=f.lbl;
    sp.onclick=()=>{ curFilter = (curFilter===f.k?"all":f.k); render(); };
    cont.appendChild(sp);
  });
  // appliquer le filtre
  const flt = FILTERS.find(f=>f.k===curFilter) || FILTERS[0];
  let rows = allRows.filter(flt.test);
  // sort
  rows.sort((a,b)=>{
    let x,y;
    if(sortKey==="priorite"){ x=a.sev; y=b.sev; if(x===y){x=a.ca_nat;y=b.ca_nat;} }
    else if(sortKey==="situation"){ x=a.sev; y=b.sev; }
    else { x=a[sortKey]; y=b[sortKey]; }
    if(x===null)x=-Infinity; if(y===null)y=-Infinity;
    if(typeof x==="string") return sortDir*x.localeCompare(y);
    return sortDir*(x-y);
  });
  // body
  const body=document.getElementById("body"); body.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    const stockCls = r.sev===4?"stock r":(r.sev===3.7?"stock f":(r.sev===3.5?"stock i":"stock"));
    const progCls = (r.prog_mag!==null&&r.prog_mag<0)?"neg":"";
    const progNatCls = (r.prog_nat!==null&&r.prog_nat<0)?"neg":"";
    tr.innerHTML =
      `<td class="badge ${r.bcls}" data-label="Priorité" data-short="${SHORT_BADGE[r.bcls]||''}">${r.badge}</td>`+
      `<td data-label="Rang nat.">${r.rang}</td>`+
      `<td class="code" data-code="${r.code}" data-label="Code" title="Cliquer pour copier">${r.code}</td>`+
      `<td class="prod" data-label="Produit">${r.nom}</td>`+
      `<td data-label="Gamme">${r.gamme||""}</td>`+
      `<td data-label="CA nat.">${fmtEuro(r.ca_nat)}</td>`+
      `<td class="camagcol" data-label="CA mag.">${fmtEuro(r.ca_mag)}</td>`+
      `<td class="${stockCls}" data-label="Stock">${fmtStock(r.stock)}</td>`+
      `<td data-label="Situation">${r.situation}</td>`+
      `<td class="${progCls}" data-label="Prog mag.">${fmtProg(r.prog_mag)}</td>`+
      `<td class="pnat ${progNatCls}" data-label="Prog nat.">${fmtProg(r.prog_nat)}</td>`;
    body.appendChild(tr);
  });
}
render();

// ===== Vue consolidée GROUPE =====
let grpSortKey = "score", grpSortDir = -1;
function renderGroupe(){
  let flops = flopsGroupe();
  const mags = Object.keys(DATA);
  const cont = document.getElementById("counts");
  cont.innerHTML = `<span class="pill r on">${flops.length} flop(s) commun(s) aux 3 magasins</span>`;
  // colonnes triables : clé + libellé
  const cols = [
    {k:"rang", t:"Rang nat."},
    {k:"code", t:"Code"},
    {k:"nom", t:"Produit"},
    {k:"ca_nat", t:"CA nat."},
    ...mags.map((m,i)=>({k:"mag"+i, t:m}))
  ];
  const head=document.getElementById("head"); head.innerHTML="";
  cols.forEach(c=>{
    const th=document.createElement("th");
    th.innerHTML=c.t+(grpSortKey===c.k?' <span class="arr">'+(grpSortDir<0?"▼":"▲")+'</span>':' <span class="arr">↕</span>');
    th.onclick=()=>{ if(grpSortKey===c.k)grpSortDir=-grpSortDir; else {grpSortKey=c.k;grpSortDir=(c.k==="nom"||c.k==="code")?1:-1;} renderGroupe(); };
    head.appendChild(th);
  });
  // tri
  flops.sort((a,b)=>{
    let x,y;
    if(grpSortKey==="score"){ x=a.scoreGrp; y=b.scoreGrp; if(x===y){x=a.ca_nat;y=b.ca_nat;} }
    else if(grpSortKey.startsWith("mag")){ const i=+grpSortKey.slice(3); x=a.parMag[i].sev; y=b.parMag[i].sev; }
    else { x=a[grpSortKey]; y=b[grpSortKey]; }
    if(x===null)x=-Infinity; if(y===null)y=-Infinity;
    if(typeof x==="string") return grpSortDir*x.localeCompare(y);
    return grpSortDir*(x-y);
  });
  const body=document.getElementById("body"); body.innerHTML="";
  if(flops.length===0){
    body.innerHTML = `<tr><td colspan="${cols.length}" style="padding:24px;color:#5b6b7a">Aucune référence en alerte simultanément dans les 3 magasins.</td></tr>`;
    return;
  }
  flops.forEach(f=>{
    const tr=document.createElement("tr");
    let cells =
      `<td data-label="Rang nat.">${f.rang}</td>`+
      `<td class="code" data-code="${f.code}" data-label="Code" title="Cliquer pour copier">${f.code}</td>`+
      `<td class="prod" data-label="Produit">${f.nom}</td>`+
      `<td data-label="CA nat.">${fmtEuro(f.ca_nat)}</td>`;
    f.parMag.forEach((r,idx)=>{
      cells += `<td class="badge grpcell ${r.bcls}" data-label="${mags[idx]}" title="Stock ${fmtStock(r.stock)} · Prog ${fmtProg(r.prog_mag)}">${r.badge}<br><span class="camag">${fmtEuro(r.ca_mag)}</span></td>`;
    });
    tr.innerHTML = cells;
    body.appendChild(tr);
  });
}

// clic sur un code = copie dans le presse-papiers (pour coller dans Booster)
document.getElementById("body").addEventListener("click", function(e){
  const td = e.target.closest("td.code");
  if(!td) return;
  const code = td.getAttribute("data-code");
  const done = ()=>{
    const old = td.getAttribute("data-code");
    td.classList.add("copied"); td.textContent = "✓ copié";
    setTimeout(()=>{ td.classList.remove("copied"); td.textContent = old; }, 900);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(()=>fallback(code,done));
  } else { fallback(code,done); }
});
function fallback(text, cb){
  const ta=document.createElement("textarea"); ta.value=text;
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy");}catch(_){} document.body.removeChild(ta); cb();
}
}
window.demarrerApp = demarrerApp;
